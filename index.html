let data = {submissions:[], literature:[], publications:[], software:[], life:[], members:[]};
let literatureTab = 'group';
const titles={files:'共享文件',ai:'AI 助手',dashboard:'工作台',literature:'文献资料',publications:'发表成果',submissions:'投稿追踪',software:'软件工具',life:'组内生活',members:'成员名录',settings:'设置'};
const icons={book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20"/></svg>',file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 12 4 4L19 6"/></svg>',members:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 5.5a3.5 3.5 0 0 1 0 6.8"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg>'};
function statusLabel(s){return({under_review:'送审',revision:'返修',major_revision:'返修',minor_revision:'返修',submitted:'投稿',accepted:'接收',published:'发表',rejected:'已拒稿',draft:'准备投稿'})[s]||s}
function statusClass(s){return({under_review:'',revision:'orange',major_revision:'orange',minor_revision:'orange',submitted:'gray',accepted:'green',published:'green',rejected:'red',draft:'gray'})[s]||'gray'}
document.querySelectorAll('.nav').forEach(nav=>nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)}));
function header(eyebrow,title,desc,action=''){return `<div class="page-title"><h1 class="page-heading-hidden">${title}</h1>${action}</div>`}
function stat(label,value,foot,icon){return `<div class="card stat"><div class="stat-top"><span>${label}</span><i class="stat-icon">${icon}</i></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function render(page){return page==='files'?filesPage():page==='ai'?aiPage():page==='dashboard'?dashboard():page==='submissions'?submissionsPage():page==='literature'?literaturePage():page==='publications'?publicationsPage():page==='software'?softwarePage():page==='life'?lifePage():page==='members'?membersPage():settingsPage()}
function toolrow(placeholder,filters='',action=''){return `<div class="page-tools"><label class="search" style="width:260px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg><input class="local-search" placeholder="${placeholder}" oninput="filterRows(this.value)" /></label>${filters}${action}</div>`}
function submissionsPage(){return `<div class="journal-tracker"><div id="journalProgress" class="grid journal-cards">正在读取期刊进度…</div><p id="journalMonitorStatus" class="journal-monitor-status" role="status"></p></div>`}
function setLiteratureTab(tab){literatureTab=tab;document.getElementById('content').innerHTML=literaturePage()}
function literaturePage(){const group=data.literature;const shared=(data.files||[]).filter(file=>file.section==='literature');const groupAction='<button class="btn primary literature-upload-button" onclick="openModal(\'literature\')">'+icons.plus+'<span>上传文献</span></button>';const sharedAction='<button class="btn primary literature-upload-button" onclick="uploadDialog(\'literature\')">'+icons.plus+'<span>上传文献</span></button>';const sharedYear=file=>group.find(record=>record.id===file.record_id)?.year||file.created.slice(0,4);const tabs=`<div class="literature-tabs" role="tablist"><button class="btn ${literatureTab==='group'?'active':''}" onclick="setLiteratureTab('group')">课题组文献 <span>${group.length}</span></button><button class="btn ${literatureTab==='shared'?'active':''}" onclick="setLiteratureTab('shared')">共享文献 <span>${shared.length}</span></button></div>`;const groupTools=toolrow('搜索标题、作者或关键词…','<select class="filter-select" onchange="filterCategory(this.value)"><option value="">全部年份</option>'+yearOptions(group)+'</select>',groupAction);const sharedTools=toolrow('搜索文件名、上传者或关联文献…','<select class="filter-select" onchange="filterCategory(this.value)"><option value="">全部年份</option>'+yearOptions(shared.map(file=>({year:sharedYear(file)})))+'</select>',sharedAction);const groupCards=group.map((x,i)=>`<article class="card resource-card" data-component-id="${x.id}" data-search="${esc((x.title+' '+x.authors+' '+x.journal+' '+x.tags).toLowerCase())}" data-category="${x.year}"><div class="resource-card-top"><div class="file-icon">${esc(x.type||'PDF')}</div><button class="mini-btn" onclick="recordDialog('literature',${i})">···</button></div><h3>${esc(x.title)}</h3><p>${esc(x.authors)}<br>${esc(x.journal)} · ${x.year}</p><div class="meta">${(x.tags||'资料').split(',').map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div><div class="card-footer"><small>${x.doi?'DOI: '+esc(x.doi):'课题组文献'}</small><button class="subtle-link" onclick="recordDialog('literature',${i})">查看详情 →</button></div></article>`).join('');const sharedCards=shared.map(file=>{const record=group.find(item=>item.id===file.record_id);const ext=file.name.includes('.')?file.name.split('.').pop().slice(0,8).toUpperCase():'PDF';const audience=file.audience==='private'?'仅上传者可见':file.audience==='selected'?'指定成员可见':'全组共享';return `<article class="card shared-file" data-component-id="${file.id}" data-category="${esc(sharedYear(file))}" data-search="${esc((file.name+' '+file.uploader+' '+(record?.title||'')).toLowerCase())}"><div class="resource-card-top"><span class="file-type">${esc(ext)}</span><span class="file-size">${formatSize(file.size)}</span></div><h3 title="${esc(file.name)}">${esc(file.name)}</h3><p class="file-association">${record?`关联课题组文献：${esc(record.title)}`:'共享文献资料'}</p><small>${esc(file.uploader)} · ${esc(new Date(file.created).toLocaleDateString('zh-CN'))} · ${audience}</small><div class="card-footer"><a class="btn file-download" href="/api/files/${file.id}" download>${icons.download} 下载文献</a>${currentUser.role!=='student'||file.owner===currentUser.id?`<button class="mini-btn" onclick="deleteSharedFile(this,'${file.id}')">删除</button>`:`<span class="tag">${audience}</span>`}</div></article>`}).join('');const shown=literatureTab==='group'?groupCards:sharedCards;return `${tabs}${literatureTab==='group'?groupTools:sharedTools}<div class="grid cards-grid" id="resourceCards">${shown}</div><div class="empty" id="cardsEmpty" style="display:${shown?'none':'block'}">${literatureTab==='group'?'还没有课题组文献':'还没有共享文献；上传文献后会自动显示在这里。'}</div>`}
function publicationsPage(){return `${header('PUBLICATIONS','发表成果','展示课题组研究成果，按年份检索与分享。','<button class="btn primary" onclick="openModal(\'publications\')">'+icons.plus+' 录入成果</button>')}${toolrow('搜索论文标题、期刊或作者…','<select class="filter-select" onchange="filterCategory(this.value)"><option value="">所有年份</option>'+yearOptions(data.publications)+'</select>')}<div class="grid cards-grid" id="resourceCards">${data.publications.map((x,i)=>`<article class="card resource-card" data-component-id="${x.id}" data-search="${esc((x.title+' '+x.authors+' '+x.journal+' '+x.doi).toLowerCase())}" data-category="${x.year}"><div class="resource-card-top"><span class="tag green">${x.year} · 研究论文</span><button class="mini-btn" onclick="recordDialog('publications',${i})">···</button></div><h3>${esc(x.title)}</h3><p>${esc(x.authors)}</p><div class="meta"><span>${esc(x.journal)}</span></div><div class="card-footer"><small>DOI · ${esc(x.doi||'待补充')}</small><button class="subtle-link" onclick="recordDialog('publications',${i})">查看详情 →</button></div></article>`).join('')}</div><div class="empty" id="cardsEmpty" style="display:none">没有找到匹配的成果</div>`}
function lifePage(){return `${header('LAB LIFE','组内生活','记录课题组的相聚、活动与日常。','<button class="btn primary" onclick="openModal(\'life\')">＋ 发布动态</button>')}${lifeHero()}<div class="notice">这里留给研究之外的片刻：野外笔记、组会记录和课题组活动都可以在此分享。</div><div class="grid cards-grid" id="resourceCards">${data.life.map((x,i)=>`<article class="card resource-card" data-component-id="${x.id}" data-search="${esc((x.title+' '+x.description+' '+x.tags).toLowerCase())}" data-category="${esc(x.category)}"><div class="resource-card-top"><span class="tag">${esc(x.category)}</span><button class="mini-btn" onclick="recordDialog('life',${i})">···</button></div>${lifePhotos(x).length ? `<button class="life-cover" onclick="lifeAlbum(${i})" aria-label="浏览 ${esc(x.title)} 相册"><img src="/api/files/${lifePhotos(x)[0].id}/preview?size=thumb" loading="lazy" decoding="async" alt="${esc(x.title)} 相册封面" onerror="this.parentElement.hidden=true"></button>` : ''}<h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><div class="meta"><span>${lifePhotos(x).length} 张照片</span>${(x.tags||'').split(',').map(t=>`<span>${esc(t.trim())}</span>`).join('')}</div><div class="card-footer"><small>${esc(data.members.find(m=>m.id===x.owner)?.name||'课题组成员')}</small><button class="subtle-link" onclick="lifeAlbum(${i})">浏览相册 →</button><button class="subtle-link" onclick="recordDialog('life',${i})">编辑 / 附件</button></div></article>`).join('')}</div><div class="empty" id="cardsEmpty" style="display:none">还没有相关动态</div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showEmpty(empty,items){let visible=[...document.querySelectorAll(items)].some(x=>x.style.display!=='none');let e=document.querySelector(empty);if(e)e.style.display=visible?'none':'block'}
function globalFind(){fileContext=null;let q=document.getElementById('globalSearch').value.trim().toLowerCase();if(!q)return;const found=Object.entries(data).find(([k,items])=>items.some(x=>JSON.stringify(x).toLowerCase().includes(q)));if(found){navigate(found[0]);setTimeout(()=>{const f=document.querySelector('.local-search');if(f){f.value=q;f.dispatchEvent(new Event('input'))}},0)}else toast('没有找到相关内容')}
function toggleMenu(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('mobileOverlay').classList.toggle('show',open)}
function toast(text){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>root.innerHTML='',2400)}
function openModal(type){const names={submissions:'新建投稿',literature:'上传文献',publications:'录入发表成果',software:'添加软件工具',life:'发布组内动态',members:'添加成员'};const common='<div class="field"><label>标题 / 姓名</label><input name="title" required placeholder="填写名称" /></div>';let fields=common;const add=(label,name,placeholder='',full=false,type='text')=>`<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" /></div>`;if(type==='submissions')fields+=add('目标期刊','journal','期刊名称')+`<div class="field"><label>当前状态</label><select name="status"><option value="submitted">投稿</option><option value="under_review">送审</option><option value="revision">返修</option><option value="accepted">接收</option><option value="published">发表</option></select></div>`+add('负责人','author','成员姓名')+add('投稿日期','date', '',false,'date')+add('修回截止','deadline','',false,'date');else if(type==='literature')fields+=add('作者','authors','作者列表',true)+add('期刊 / 来源','journal','期刊名称')+add('年份','year','2026')+add('标签','tags','湿地, 水鸟')+add('DOI','doi','10.xxxx/xxxxx');else if(type==='publications')fields+=add('作者','authors','作者列表',true)+add('期刊','journal','期刊名称')+add('年份','year','2026')+add('DOI','doi','10.xxxx/xxxxx');else if(type==='software')fields+=toolEditorFields(add);else if(type==='life')fields+=add('内容','description','分享一段课题组生活',true)+add('类型','category','野外调查 / 组内活动')+add('日期','version',new Date().toISOString().slice(0,10));else if(type==='members')fields+=add('角色','role','研究生 / 科研助理')+add('研究方向','field','湿地生态');document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><form class="modal ${type==='software'?'tool-editor':''}" onsubmit="submitModal(event,'${type}')"><div class="modal-head"><h2>${names[type]}</h2><button type="button" class="close" onclick="closeModal()">×</button></div><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary" type="submit">保存记录</button></div></form></div>`}
function closeModal(keepDashboard=false){if(uploadBusy&&!uploadCancelled){if(!confirm('取消当前上传？已经上传成功的文件会保留。'))return;uploadCancelled=true;activeUpload?.abort()}document.getElementById('modalRoot').innerHTML='';if(!keepDashboard&&!dashboardEditing&&!dashboardSaving&&dashboardDraft){dashboardDraft=null;dashboardRefresh()}}
boot();
</script>
</body>
</html>
